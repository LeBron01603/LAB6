<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DOM Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-wrapper">
    <header class="app-header">
      <span class="label-tag">LAB · DOM</span>
      <h1>MIS TAREAS</h1>
     
    </header>

    <section class="input-section">
      <div class="input-row">
        <input
          type="text"
          id="taskInput"
          placeholder="Escribe una nueva tarea…"
          autocomplete="off"
          maxlength="120"
        />
        <button id="addBtn">+ Agregar</button>
      </div>
      <p id="errorMsg" class="error-msg" aria-live="polite"></p>
    </section>

    <section class="counter-section">
      <div class="counter-box">
        <span id="pendingCount">0</span>
        <span class="counter-label">pendientes</span>
      </div>
      <div class="counter-box secondary">
        <span id="totalCount">0</span>
        <span class="counter-label">total</span>
      </div>
      <div class="counter-box done-box">
        <span id="doneCount">0</span>
        <span class="counter-label">completadas</span>
      </div>
    </section>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendientes</button>
      <button class="filter-btn" data-filter="done">Completadas</button>
    </div>

    <ul id="taskList" class="task-list">
      <!-- Las tareas se insertan aquí via JS -->
    </ul>

    <div id="emptyState" class="empty-state">
      <span class="empty-icon">📋</span>
      <p>No hay tareas todavía.<br/>¡Agrega la primera!</p>
    </div>

    <div class="bottom-bar">
      <button id="clearDoneBtn" class="clear-btn">Limpiar completadas</button>
    </div>
  </div>

<script type="module" src="app.js"></script>
</body>
</html>
